role: PhD Student in Embodied AI

bio: |
  I am a PhD student at the Technical University of Munich, advised by Prof. Ziyue Li,
  and a lecturer at Hainan Bielefeld University of Applied Sciences.

  My research focuses on vision-language-action (VLA) models, world action models (WAMs),
  and mobile manipulation, with an emphasis on memory and agentic planning in VLA systems.

