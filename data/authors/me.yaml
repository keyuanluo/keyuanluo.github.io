role: PhD Student in Robot Learning

bio: |
  I am a PhD student at the Technical University of Munich, advised by Prof. Ziyue Li,
  and a lecturer at Hainan Bielefeld University of Applied Sciences. My research focuses
  on robot learning, particularly memory-augmented vision-language-action (VLA) models
  for long-horizon tasks. I study how robots can retain and reuse experience over time,
  and how to evaluate the role of memory in decision-making. I also investigate
  multimodal adaptation of pretrained robotic policies. Previously, my master's
  research at Technische Universität Berlin explored cross-modal transformers for
  pedestrian crossing intention prediction.

